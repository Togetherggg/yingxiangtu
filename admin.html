<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>效果图网址 · 管理后台</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  body { overflow: auto; display: block; background: var(--bg); }
  .adm-top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: rgba(8, 10, 15, .86); backdrop-filter: blur(16px);
  }
  .adm-brand { display: flex; align-items: center; gap: 11px; }
  .adm-mark {
    width: 38px; height: 38px; border-radius: 12px; background: var(--grad);
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px;
    box-shadow: 0 10px 22px -12px rgba(109, 76, 255, .9);
  }
  .adm-brand b { font-size: 15px; display: block; line-height: 1.2; }
  .adm-brand em { font-style: normal; font-size: 11px; color: var(--text-3); letter-spacing: .05em; }
  .adm-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .adm-wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 110px; }
  .adm-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; margin-bottom: 16px;
  }
  .adm-card h2 { font-size: 15px; font-weight: 650; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .adm-card h2 .hint { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: auto; }
  .adm-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .adm-col { min-width: 0; }
  .adm-field { margin-bottom: 12px; }
  .adm-field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .adm-field .input, .adm-field select, .adm-field textarea { width: 100%; }
  .adm-field select { height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 12px; }
  .adm-row { display: flex; gap: 8px; }
  .adm-row > * { min-width: 0; }
  .adm-login { max-width: 460px; margin: 80px auto; text-align: center; }
  .adm-login .adm-mark { margin: 0 auto 16px; width: 56px; height: 56px; border-radius: 18px; font-size: 26px; }
  .adm-login h1 { font-size: 20px; margin-bottom: 8px; }
  .adm-login p { font-size: 12.5px; color: var(--text-3); line-height: 1.8; margin-bottom: 18px; }
  .adm-login .input { text-align: left; }
  .adm-status {
    display: flex; align-items: center; gap: 8px; min-height: 22px;
    font-size: 12px; color: var(--text-3); margin-bottom: 10px;
  }
  .adm-status.ok { color: var(--ok); }
  .adm-status.err { color: var(--fail); }
  .adm-status.warn { color: var(--warn); }
  .adm-status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .adm-stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin: 4px 0 16px; }
  .adm-stats b { color: var(--text); font-size: 18px; margin-right: 3px; font-variant-numeric: tabular-nums; }
  .adm-list { display: flex; flex-direction: column; gap: 6px; max-height: 460px; overflow: auto; }
  .adm-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--panel);
  }
  .adm-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); flex: 0 0 auto; }
  .adm-item .name { font-size: 13px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-item .count { font-size: 11px; color: var(--text-3); flex: 0 0 auto; }
  .adm-item .url { font-size: 11px; color: var(--text-3); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-item .meta { font-size: 11px; color: var(--text-3); flex: 0 0 auto; }
  .adm-del {
    border: 0; background: none; color: var(--text-3); font-size: 11.5px; padding: 3px 8px;
    border-radius: 7px; flex: 0 0 auto;
  }
  .adm-del:hover { color: #ff9bac; background: rgba(251, 113, 133, .12); }
  .adm-sw { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
  .adm-sw button {
    width: 26px; height: 26px; border-radius: 8px; border: 2px solid transparent;
    background: var(--c); padding: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .adm-sw button.is-active { border-color: var(--text); }
  .adm-savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px; padding: 12px 22px;
    background: rgba(8, 10, 15, .9); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .adm-savebar .status { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-savebar .dirty { color: var(--warn); }
  .adm-tip { font-size: 11px; color: var(--text-3); line-height: 1.7; margin-top: 10px; }
  .adm-empty { text-align: center; color: var(--text-3); font-size: 12.5px; padding: 22px 0; }
  .adm-link-title { display: block; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-link-sub { display: block; font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .adm-list-head { display: flex; gap: 8px; margin-bottom: 10px; }
  .adm-list-head .input { flex: 1 1 auto; }
  @media (max-width: 880px) {
    .adm-grid { grid-template-columns: 1fr; }
    .adm-top { padding: 12px 14px; }
    .adm-wrap { padding: 16px 14px 120px; }
    .adm-brand em { display: none; }
    .adm-card { padding: 15px; }
    .adm-savebar { padding: 10px 14px; }
    .adm-savebar .status { display: none; }
  }
</style>
</head>
<body>

<header class="adm-top">
  <div class="adm-brand">
    <div class="adm-mark">效</div>
    <div><b>效果图网址 · 管理</b><em>添加 / 删除 / 新建风格</em></div>
  </div>
  <div class="adm-actions">
    <a class="btn btn-sm" href="./" target="_blank" rel="noopener">打开公网页</a>
    <button class="btn btn-sm" id="refreshBtn" hidden>刷新数据</button>
    <button class="btn btn-sm" id="logoutBtn" hidden>退出管理</button>
  </div>
</header>

<div class="adm-wrap">
  <section id="loginPanel" class="adm-card adm-login" hidden>
    <div class="adm-mark">效</div>
    <h1>效果图管理后台</h1>
    <p>输入 GitHub Token 后，就能在这里添加、删除效果图，新建风格。<br>保存后会更新公网只读页面；Token 只保存在本机浏览器里。</p>
    <div class="adm-field">
      <input class="input" id="tokenInput" type="password" placeholder="ghp_... 或 github_pat_..." autocomplete="off" spellcheck="false">
    </div>
    <div class="adm-status" id="loginStatus"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%">进入管理</button>
    <div class="adm-tip">Token 需要该仓库的 Contents 读写权限。第一次使用请输入，之后会自动记住。不要把这个页面和 Token 发给别人。</div>
  </section>

  <section id="adminPanel" hidden>
    <div class="adm-status" id="statusBar"><span class="dot"></span><span id="statusText">正在连接…</span></div>
    <div class="adm-stats">
      <span><b id="statLinks">0</b>条链接</span>
      <span><b id="statCats">0</b>种风格</span>
      <span><b id="statDirty">0</b>处未保存</span>
    </div>

    <div class="adm-grid">
      <div class="adm-col">
        <div class="adm-card">
          <h2>添加效果图</h2>
          <form id="addLinkForm">
            <div class="adm-field">
              <label for="addUrl">链接地址 *</label>
              <input class="input" id="addUrl" type="text" inputmode="url" placeholder="https://vr.justeasy.cn/view/…" autocomplete="off" spellcheck="false">
            </div>
            <div class="adm-field">
              <label for="addTitle">标题（可留空）</label>
              <input class="input" id="addTitle" type="text" maxlength="60" placeholder="例如：源质 · 现代客厅" autocomplete="off">
            </div>
            <div class="adm-field">
              <label for="addCat">风格</label>
              <select id="addCat"></select>
            </div>
            <div class="adm-field">
              <label for="addCover">封面图 URL（可选）</label>
              <input class="input" id="addCover" type="text" placeholder="https://…/cover.jpg" autocomplete="off" spellcheck="false">
            </div>
            <button class="btn btn-primary" type="submit" style="width:100%">添加这条链接</button>
          </form>
        </div>

        <div class="adm-card">
          <h2>新建风格</h2>
          <form id="addCatForm">
            <div class="adm-field">
              <label for="catName">风格名称 *</label>
              <input class="input" id="catName" type="text" maxlength="12" placeholder="例如：法式复古、日式原木…" autocomplete="off">
            </div>
            <div class="adm-field">
              <label>标记颜色</label>
              <div class="adm-sw" id="catColors"></div>
            </div>
            <button class="btn" type="submit" style="width:100%">新建风格</button>
          </form>
        </div>

        <div class="adm-card">
          <h2>风格管理 <span class="hint">删除风格会同时删除其下链接</span></h2>
          <div class="adm-list" id="catList"></div>
        </div>
      </div>

      <div class="adm-col">
        <div class="adm-card">
          <h2>已有链接 <span class="hint" id="linkCount"></span></h2>
          <div class="adm-list-head">
            <input class="input" id="filterInput" type="search" placeholder="搜索标题 / 网址 / 风格…" autocomplete="off">
          </div>
          <div class="adm-list" id="linkList"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="adm-savebar" id="saveBar" hidden>
  <div class="status" id="saveStatus">已就绪</div>
  <button class="btn btn-sm" id="reloadBtn">放弃修改</button>
  <button class="btn btn-primary" id="saveBtn" disabled>保存并发布</button>
</div>

<script>
(function () {
  'use strict';
  const OWNER = 'Togetherggg';
  const REPO = 'yingxiangtu';
  const FILE = 'index.html';
  const API = 'https://api.github.com/repos/' + OWNER + '/' + REPO;
  const LS_TOKEN = 'yxg.admin.token.v1';
  const PALETTE = ['#C9A227','#B08968','#8A7CFF','#4FC3F7','#5FD3B4','#D9A066','#F2B8B5','#F2D8A8','#C3A6E8','#9AA7B8','#A8B5A2','#D7E1EA'];
  const SITES = { 'vr.justeasy.cn':'建E全景','vr.3d66.com':'3D66全景','vr.zhiouwang.com':'知欧全景','vr.1miba.com':'米吧全景','vr.shinewonder.com':'ShineWonder' };

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  let token = '';
  let html = '';
  let baseSha = '';
  let lib = null;
  let dirty = 0;
  let busy = false;
  let pickColor = PALETTE[0];

  function setStatus(text, type) {
    const bar = $('#statusBar');
    if (!bar) return;
    bar.className = 'adm-status' + (type ? ' ' + type : '');
    $('#statusText').textContent = text;
  }
  function setSaveStatus(text, type) {
    const el = $('#saveStatus');
    if (!el) return;
    el.textContent = text;
    el.style.color = type === 'err' ? 'var(--fail)' : type === 'warn' ? 'var(--warn)' : type === 'ok' ? 'var(--ok)' : '';
  }
  function updateStats() {
    $('#statLinks').textContent = lib ? lib.links.length : 0;
    $('#statCats').textContent = lib ? lib.categories.length : 0;
    $('#statDirty').textContent = dirty;
    $('#statDirty').style.color = dirty ? 'var(--warn)' : '';
    $('#saveBtn').disabled = busy || dirty === 0;
    $('#saveBar').hidden = !lib;
    if (lib) setSaveStatus(dirty ? '有 ' + dirty + ' 处未保存修改' : '已与公网页同步', dirty ? 'warn' : 'ok');
  }
  function markDirty() { dirty++; updateStats(); }

  function decodeB64(b64) {
    const bin = atob(String(b64 || '').replace(/\s/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function encodeB64(text) {
    const bytes = new TextEncoder().encode(text);
    let bin = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  async function api(method, path, body) {
    const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
    if (body) headers['Content-Type'] = 'application/json';
    const res = await fetch(API + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      const err = new Error((data && data.message) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function catName(id) {
    const c = lib.categories.filter((x) => x.id === id)[0];
    return c ? c.name : '未分类';
  }
  function catColor(id) {
    const c = lib.categories.filter((x) => x.id === id)[0];
    return (c && c.color) || PALETTE[0];
  }
  function sortedCats() {
    return lib.categories.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  }
  function siteOf(link) {
    return link.site || SITES[link.source] || String(link.source || '').replace(/^www\./, '') || '未知来源';
  }

  function render() {
    updateStats();
    const catList = $('#catList');
    catList.innerHTML = sortedCats().map((c) => {
      const n = lib.links.filter((l) => l.categoryId === c.id).length;
      return '<div class="adm-item" style="--c:' + esc(c.color) + '">' +
        '<i class="dot"></i><span class="name">' + esc(c.name) + '</span>' +
        '<span class="count">' + n + ' 条</span>' +
        '<button class="adm-del" type="button" data-delcat="' + esc(c.id) + '">删除</button></div>';
    }).join('') || '<div class="adm-empty">还没有风格，先新建一个</div>';

    const sel = $('#addCat');
    const current = sel.value;
    sel.innerHTML = sortedCats().map((c) => '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>').join('');
    if (current && sortedCats().some((c) => c.id === current)) sel.value = current;

    renderLinks();
    updateStats();
  }

  function renderLinks() {
    const q = ($('#filterInput').value || '').trim().toLowerCase();
    const cats = sortedCats();
    const order = {};
    cats.forEach((c, i) => { order[c.id] = i; });
    let links = lib.links.slice();
    if (q) {
      links = links.filter((l) => ([l.title, l.url, l.note, siteOf(l), catName(l.categoryId)].join(' ').toLowerCase().indexOf(q) >= 0));
    }
    links.sort((a, b) => (order[a.categoryId] || 0) - (order[b.categoryId] || 0) || (a.order || 0) - (b.order || 0));
    $('#linkCount').textContent = links.length + ' / ' + lib.links.length + ' 条';
    $('#linkList').innerHTML = links.map((l) => (
      '<div class="adm-item" style="--c:' + esc(catColor(l.categoryId)) + '">' +
        '<i class="dot"></i>' +
        '<div style="flex:1 1 auto;min-width:0">' +
          '<span class="adm-link-title">' + esc(l.title || '未命名') + '</span>' +
          '<span class="adm-link-sub">' + esc(catName(l.categoryId)) + ' · ' + esc(siteOf(l)) + ' · ' + esc(l.url) + '</span>' +
        '</div>' +
        '<a class="meta" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent-2);text-decoration:none">打开</a>' +
        '<button class="adm-del" type="button" data-del="' + esc(l.id) + '">删除</button>' +
      '</div>'
    )).join('') || '<div class="adm-empty">' + (q ? '没有匹配的链接' : '还没有链接，先添加一条') + '</div>';
  }

  function showLogin(msg) {
    $('#loginPanel').hidden = false;
    $('#adminPanel').hidden = true;
    $('#saveBar').hidden = true;
    $('#refreshBtn').hidden = true;
    $('#logoutBtn').hidden = true;
    const st = $('#loginStatus');
    st.textContent = msg || '';
    st.className = 'adm-status' + (msg ? ' err' : '');
  }

  function showAdmin() {
    $('#loginPanel').hidden = true;
    $('#adminPanel').hidden = false;
    $('#saveBar').hidden = false;
    $('#refreshBtn').hidden = false;
    $('#logoutBtn').hidden = false;
  }

  async function loadData() {
    setStatus('读取公网页数据…');
    const repo = await api('GET', '');
    const file = await api('GET', '/contents/' + FILE);
    baseSha = file.sha;
    html = decodeB64(file.content);
    const m = html.match(/window\.__PUBLIC_LIBRARY__=([\s\S]*?);<\/script>/);
    if (!m) throw new Error('没有在 index.html 里找到数据，可能页面结构已变化');
    lib = JSON.parse(m[1]);
    if (!Array.isArray(lib.categories)) lib.categories = [];
    if (!Array.isArray(lib.links)) lib.links = [];
    if (!Array.isArray(lib.tombstones)) lib.tombstones = [];
    dirty = 0;
    showAdmin();
    render();
    setStatus('已连接 ' + repo.full_name + ' · 数据已载入', 'ok');
    setSaveStatus('已与公网页同步', 'ok');
  }

  async function login() {
    if (!token) { showLogin(''); return; }
    $('#loginBtn').disabled = true;
    $('#loginBtn').textContent = '验证中…';
    try {
      await loadData();
      localStorage.setItem(LS_TOKEN, token);
    } catch (e) {
      showLogin(e.status === 401 ? 'Token 无效或已过期' : (e.status === 404 ? 'Token 没有这个仓库的权限' : ('读取失败：' + e.message)));
    } finally {
      $('#loginBtn').disabled = false;
      $('#loginBtn').textContent = '进入管理';
    }
  }

  async function save() {
    if (!lib || busy || !dirty) return;
    busy = true;
    updateStats();
    setSaveStatus('正在发布到 GitHub…', 'warn');
    setStatus('正在保存…', 'warn');
    try {
      const json = JSON.stringify(lib).replace(/<\//g, '<\\/');
      const newHtml = html.replace(/(window\.__PUBLIC_LIBRARY__=)([\s\S]*?)(;<\/script>)/, function (m, a, b, c) { return a + json + c; });
      if (newHtml === html) throw new Error('页面数据替换失败，请刷新后重试');
      const res = await api('PUT', '/contents/' + FILE, {
        message: '管理后台更新 ' + new Date().toLocaleString('zh-CN'),
        content: encodeB64(newHtml),
        branch: 'main',
        sha: baseSha
      });
      html = newHtml;
      baseSha = res.content.sha;
      dirty = 0;
      updateStats();
      setSaveStatus('已发布，等待公网页更新…', 'ok');
      setStatus('已提交，GitHub Pages 构建中…', 'ok');
      pollBuild();
    } catch (e) {
      if (e.status === 409) {
        setSaveStatus('公网页已被更新，请点「刷新数据」后重试', 'err');
        setStatus('数据冲突：请刷新', 'err');
      } else {
        setSaveStatus('保存失败：' + e.message, 'err');
        setStatus('保存失败', 'err');
      }
    } finally {
      busy = false;
      updateStats();
    }
  }

  async function pollBuild() {
    for (let i = 0; i < 36; i++) {
      await sleep(5000);
      try {
        const b = await api('GET', '/pages/builds/latest');
        if (b.status === 'built') {
          setStatus('公网页已更新，可以打开查看', 'ok');
          setSaveStatus('已上线', 'ok');
          return;
        }
        if (b.status === 'errored') {
          setStatus('Pages 构建失败，请到仓库 Actions 查看', 'err');
          return;
        }
        setStatus('构建中…（约 1 分钟）', 'warn');
      } catch (e) { /* 忽略轮询错误 */ }
    }
    setStatus('已提交，稍后刷新公网页即可', 'warn');
  }

  function normalizeUrl(raw) {
    let u = String(raw || '').trim();
    if (!u) return null;
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(u)) u = 'https://' + u;
    let parsed = null;
    try { parsed = new URL(u); } catch (e) { return null; }
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
    if (!parsed.hostname) return null;
    return parsed;
  }

  function addLink(e) {
    e.preventDefault();
    const parsed = normalizeUrl($('#addUrl').value);
    if (!parsed) { setStatus('链接格式不正确', 'err'); return; }
    const url = parsed.href;
    if (lib.links.some((l) => l.url === url)) { setStatus('这条链接已经存在', 'warn'); return; }
    const cat = $('#addCat').value || (lib.categories[0] && lib.categories[0].id);
    if (!cat) { setStatus('请先新建一个风格', 'warn'); return; }
    const coverRaw = $('#addCover').value.trim();
    let thumb = '';
    if (coverRaw) {
      const c = normalizeUrl(coverRaw);
      if (!c) { setStatus('封面图 URL 格式不正确', 'warn'); return; }
      thumb = c.href;
    }
    const host = parsed.hostname.toLowerCase();
    const maxOrder = lib.links.reduce((m, l) => Math.max(m, l.order || 0), 0);
    lib.links.unshift({
      id: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      categoryId: cat,
      url: url,
      title: $('#addTitle').value.trim(),
      note: '',
      thumb: thumb,
      source: host,
      site: SITES[host] || host.replace(/^www\./, ''),
      status: 'unknown',
      statusCheckedAt: '',
      addedAt: new Date().toISOString(),
      order: maxOrder + 1
    });
    lib.tombstones = lib.tombstones.filter((u) => u !== url);
    $('#addUrl').value = '';
    $('#addTitle').value = '';
    $('#addCover').value = '';
    markDirty();
    render();
    setStatus('已添加，记得点右下角「保存并发布」', 'ok');
  }

  function addCat(e) {
    e.preventDefault();
    const name = $('#catName').value.trim();
    if (!name) { setStatus('请填写风格名称', 'warn'); return; }
    if (lib.categories.some((c) => c.name === name)) { setStatus('已有同名风格', 'warn'); return; }
    const maxOrder = lib.categories.reduce((m, c) => Math.max(m, c.order || 0), 0);
    lib.categories.push({
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4),
      name: name,
      color: pickColor,
      order: maxOrder + 1
    });
    $('#catName').value = '';
    markDirty();
    render();
    setStatus('已新建风格「' + name + '」', 'ok');
  }

  function delLink(id) {
    const l = lib.links.filter((x) => x.id === id)[0];
    if (!l) return;
    if (!confirm('删除「' + (l.title || l.url) + '」？')) return;
    lib.links = lib.links.filter((x) => x.id !== id);
    if (lib.tombstones.indexOf(l.url) < 0) lib.tombstones.push(l.url);
    markDirty();
    render();
    setStatus('已删除，记得保存发布', 'ok');
  }

  function delCat(id) {
    const c = lib.categories.filter((x) => x.id === id)[0];
    if (!c) return;
    const n = lib.links.filter((l) => l.categoryId === id).length;
    if (lib.categories.length <= 1) { setStatus('至少保留一个风格', 'warn'); return; }
    if (!confirm('删除风格「' + c.name + '」' + (n ? '，同时删除它下面的 ' + n + ' 条链接？' : '？'))) return;
    lib.links.filter((l) => l.categoryId === id).forEach((l) => {
      if (lib.tombstones.indexOf(l.url) < 0) lib.tombstones.push(l.url);
    });
    lib.links = lib.links.filter((l) => l.categoryId !== id);
    lib.categories = lib.categories.filter((x) => x.id !== id);
    markDirty();
    render();
    setStatus('已删除风格，记得保存发布', 'ok');
  }

  function reloadData() {
    if (dirty && !confirm('放弃 ' + dirty + ' 处未保存修改，重新读取公网页数据？')) return;
    dirty = 0;
    loadData().catch((e) => setStatus('刷新失败：' + e.message, 'err'));
  }

  function initColors() {
    const box = $('#catColors');
    box.innerHTML = PALETTE.map((c) => '<button type="button" data-color="' + c + '" style="--c:' + c + '" class="' + (c === pickColor ? 'is-active' : '') + '" aria-label="' + c + '"></button>').join('');
    box.addEventListener('click', (e) => {
      const b = e.target.closest('[data-color]');
      if (!b) return;
      pickColor = b.dataset.color;
      $$('[data-color]', box).forEach((x) => x.classList.toggle('is-active', x === b));
    });
  }

  function bind() {
    $('#loginBtn').addEventListener('click', () => {
      const v = $('#tokenInput').value.trim();
      if (!v) { showLogin('请输入 Token'); return; }
      token = v;
      login();
    });
    $('#tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#loginBtn').click(); });
    $('#logoutBtn').addEventListener('click', () => {
      if (dirty && !confirm('有未保存修改，确定退出？')) return;
      localStorage.removeItem(LS_TOKEN);
      token = ''; lib = null; html = ''; baseSha = ''; dirty = 0;
      showLogin('');
      $('#tokenInput').value = '';
    });
    $('#refreshBtn').addEventListener('click', reloadData);
    $('#reloadBtn').addEventListener('click', reloadData);
    $('#saveBtn').addEventListener('click', save);
    $('#addLinkForm').addEventListener('submit', addLink);
    $('#addCatForm').addEventListener('submit', addCat);
    $('#filterInput').addEventListener('input', renderLinks);
    $('#catList').addEventListener('click', (e) => {
      const b = e.target.closest('[data-delcat]');
      if (b) delCat(b.dataset.delcat);
    });
    $('#linkList').addEventListener('click', (e) => {
      const b = e.target.closest('[data-del]');
      if (b) delLink(b.dataset.del);
    });
    window.addEventListener('beforeunload', (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  }

  function boot() {
    bind();
    initColors();
    showLogin('');
    const hash = location.hash.replace(/^#/, '');
    if (hash) {
      const params = new URLSearchParams(hash);
      const t = params.get('token');
      if (t) {
        token = t;
        try { localStorage.setItem(LS_TOKEN, token); } catch (e) {}
        history.replaceState(null, '', location.pathname + location.search);
      }
    }
    if (!token) token = localStorage.getItem(LS_TOKEN) || '';
    if (token) login(); else showLogin('');
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
